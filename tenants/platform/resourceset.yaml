---
apiVersion: kustomize.toolkit.fluxcd.io/v1alpha1
kind: ResourceSet
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 10m0s
  resources:
    - apiVersion: v1
      kind: Namespace
      selector:
        matchLabels:
          toolkit.fluxcd.io/tenant: platform
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      selector:
        matchLabels:
          toolkit.fluxcd.io/tenant: platform
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      selector:
        matchLabels:
          toolkit.fluxcd.io/tenant: platform
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      selector:
        matchLabels:
          toolkit.fluxcd.io/tenant: platform
