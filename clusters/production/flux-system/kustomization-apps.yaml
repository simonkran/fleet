---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 30m0s
  timeout: 10m0s
  sourceRef:
    kind: GitRepository
    name: apps
  path: ./clusters/production
  prune: true
  wait: false
  retryInterval: 5m0s
  dependsOn:
    - name: infra
