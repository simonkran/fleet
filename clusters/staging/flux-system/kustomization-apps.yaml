---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m0s
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: apps
  path: ./clusters/staging
  prune: true
  wait: false
  retryInterval: 2m0s
  dependsOn:
    - name: infra
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
        optional: false
